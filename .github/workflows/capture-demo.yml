name: capture live demo

on:
  push:
    branches: [video/capture-undograph-20261018]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      UNDOGRAPH_BASE_URL: https://undograph-preview.the-workflow-worker.workers.dev
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-demo.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: undograph-live-demo
          path: artifacts/live-demo/
          if-no-files-found: error
          retention-days: 1
