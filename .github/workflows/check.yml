name: checks

on:
  push:
    branches: [main, build/undograph, feat/general-workspaces]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UNDOGRAPH_OFFLINE: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run db:up
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:gateway
      - run: npm run test:gateway:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run build:gateway
      - run: docker build -t undograph-railway:test .
      - run: npm run test:railway
      - run: UNDOGRAPH_RAILWAY_PASSWORD_CASE=short npm run test:railway
      - run: UNDOGRAPH_RAILWAY_PASSWORD_CASE=quoted npm run test:railway
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
      - run: npm run db:stop
        if: always()
